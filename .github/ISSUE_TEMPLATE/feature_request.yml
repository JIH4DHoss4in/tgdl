name: Feature request
description: Propose a focused, user-visible improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-facing result rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain any current workaround or simpler approach you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Console interface
        - Monitoring and sources
        - History import and filters
        - Accounts and authorization
        - Downloads and recovery
        - Proxies and networking
        - Packaging and documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request does not require bypassing Telegram limits or accessing content without authorization.
          required: true
